protected_paths:
  - "~/.ssh"
  - "~/.aws"
  - ".env"
  - "*.pem"
  - "*.key"
  - "*_rsa"
  - "/etc"
  - "/usr"
  - "/bin"

safe_mode_blocked:
  - "bash_exec"
  - "run_python"
  - "run_tests"
  - "write_file"
  - "append_file"
  - "create_folder"
  - "delete_file"
  - "move_file"
  - "git_init"
  - "git_add_commit"
  - "git_push"
  - "install_package"