tier1:
  provider: "nvidia_nim"
  model: "z-ai/glm-5.3-flash"
  base_url: "https://integrate.api.nvidia.com/v1"

tier2:
  provider: "ollama"
  model: "gpt-oss:120b-cloud"

tier3:
  provider: "ollama"
  model: "nemotron-3-ultra:cloud"

ollama:
  base_url: "http://localhost:11434"
  tier2_model: "gpt-oss:120b-cloud"
  tier3_model: "nemotron-3-ultra:cloud"
  timeout_seconds: 180
  num_ctx: 4096

claude:
  model: "nemotron-3-ultra:cloud"
  hard_cap_usd: 25.0
  alert_threshold_usd: 15.0

routing:
  confidence_threshold: 0.72
  risk_score_threshold: 0.7

skills:
  max_per_prompt: 2
  min_trigger_matches: 2
  max_words_per_skill: 400

memory:
  max_lines_injected: 30
  line_char_limit: 150