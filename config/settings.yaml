  status: "OPERATIONAL"

tier2:
  provider: "groq"
  model: "qwen/qwen3.8-27b"
  base_url: "https://api.groq.com/openai/v1"
  status: "OPERATIONAL"

tier3:
  provider: "nvidia_nim"
  model: "nvidia/nemotron-3.5-lightning-30b-a3b"
  base_url: "https://integrate.api.nvidia.com/v1"
  status: "OPERATIONAL"

# Historical / Legacy Configurations (Preserved for rollback & test compatibility)
ollama:
  base_url: "http://localhost:11434"
  tier2_model: "gpt-oss:120b-cloud"
  tier3_model: "nemotron-3-ultra:cloud"
  timeout_seconds: 180
  num_ctx: 4096

claude:
  model: "nemotron-3-ultra:cloud"
  hard_cap_usd: 25.0
  alert_threshold_usd: 15.0

routing:
  confidence_threshold: 0.72
  risk_score_threshold: 0.7

skills:
  max_per_prompt: 2
  min_trigger_matches: 2
  max_words_per_skill: 400

memory:
  max_lines_injected: 30
  line_char_limit: 150

missions:
  default_max_turns: 40
